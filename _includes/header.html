  <nav aria-label="Menu principale">
    <ul>
      <li><a href="{{ hub }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a></li>
      <li><a href="{{ hub }}#appunti">Appunti</a></li>

</header>
