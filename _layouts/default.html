<!DOCTYPE html>
<html lang="{{ site.lang | default: "it-IT" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <script>
      // Applica il tema salvato prima del render (stessa chiave "theme" dei siti di appunti)
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicon/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicon/favicon-16x16.png' | relative_url }}">
    <link rel="manifest" href="{{ '/assets/img/favicon/site.webmanifest' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/img/favicon/favicon.ico' | relative_url }}">
    <meta name="theme-color" content="#4f46e5">
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Vai al contenuto principale</a>
    {% include header.html %}
    <main id="main-content" class="container">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
  </body>
</html>
